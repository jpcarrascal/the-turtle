[package]
name = "turtle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `turtle` CLI: a thin client for the turtled control socket (spec §10)."

[[bin]]
name = "turtle"
path = "src/main.rs"

[dependencies]
turtle-core = { workspace = true }
# WAV + SMF writing for the `gen-tone` bundle generator. Pure Rust, no C deps.
hound = "3"
midly = "0.5"

# `doctor` probes real ALSA devices and reads RT rlimits (spec §10). Linux-only,
# mirroring turtled: on the dev Mac these checks report "unknown" instead.
[dev-dependencies]
# The `ports --toml` snippet must parse as real TOML, so the test parses it
# rather than eyeballing the string. Dev-only: the CLI itself never parses TOML
# (turtle-core does that).
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"
libc = "0.2"
